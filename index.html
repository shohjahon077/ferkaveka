<head>

    <style>
        /* ===== GLOBAL STYLES ===== */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --text: #f0ffff;
            --highlight: #64ffda;
            --neon: #00f0ff;
            --bg: #000000;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
        }

        /* ===== PRELOADER ===== */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
            opacity: 1; transition: opacity 1s ease;
        }

        .logo-main {
            font-size: 2.6em; font-weight: 900; color: var(--neon);
            text-shadow: 0 0 20px var(--neon), 0 0 40px rgba(0, 240, 255, 0.7);
            margin-bottom: 15px; text-align: center;
            letter-spacing: 1px;
        }

        .sub-logo {
            font-size: 1.5em; color: #64ffda; margin-bottom: 35px;
            text-shadow: 0 0 12px rgba(100, 255, 218, 0.6);
        }

        .loading-bar {
            width: 80%; max-width: 500px; height: 10px;
            background: rgba(255, 255, 255, 0.1); border-radius: 5px;
            overflow: hidden; margin: 20px 0;
        }

        .loading-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #00f0ff, #64ffda, #ff00ff);
            box-shadow: 0 0 25px var(--neon);
            border-radius: 5px;
        }

        .skip-button {
            background: transparent; border: 2px solid var(--neon);
            color: var(--neon); padding: 12px 32px; font-family: inherit;
            font-size: 1.1em; border-radius: 30px; cursor: pointer;
            margin-top: 15px; transition: all 0.3s;
            font-weight: bold;
        }
        .skip-button:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px var(--neon);
        }

        /* ===== THREE.JS ===== */
        #threejs-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        /* ===== MAIN CONTENT — MATN KO'RINISHI UCHUN ===== */
        #main-content {
            position: relative;
            z-index: 20; /* Three.js dan yuqori */
            min-height: 1500vh;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* BU YERDA TUZATISH KIRITILDI: position va z-index qo'shildi */
        .site-section {
            min-height: 100vh;
            padding: 140px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            
            /* 🔥🔥🔥 YANGI TUZATISH START 🔥🔥🔥 */
            position: relative; /* z-index ishlashi uchun zarur */
            z-index: 25; /* #main-content ichida Three.js (z-index: 1) dan ham yuqori */
            /* 🔥🔥🔥 YANGI TUZATISH END 🔥🔥🔥 */
            
            /* Fon biroz xira — matn ajralib turadi */
            background: linear-gradient(to bottom, 
                rgba(0, 5, 15, 0.2), 
                rgba(0, 10, 25, 0.35)
            );
        }

        /* 🔥 A TEGI ICHIDAGI MATN — ANIQ KO'RINADI */
        .site-section h2 a {
            font-size: 2.1em;
            font-weight: 800;
            text-decoration: none;
            color: #ffffff !important; /* Doim oq */
            text-shadow: 
                0 0 10px rgba(100, 255, 218, 0.8),
                0 0 20px rgba(0, 240, 255, 0.6),
                0 2px 4px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
            position: relative;
            z-index: 21;
            display: inline-block;
            padding: 10px 0;
        }
        .site-section h2 a:hover {
            color: var(--highlight) !important;
            transform: translateX(6px);
        }

        /* ===== SOZLAMALAR ===== */
        #settings-panel {
            position: fixed; top: 20px; right: 20px;
            background: rgba(5, 15, 30, 0.92);
            border: 1px solid var(--neon);
            border-radius: 14px; padding: 18px;
            z-index: 100; color: white;
            backdrop-filter: blur(8px);
            display: none;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        #settings-toggle {
            position: fixed; top: 20px; right: 20px;
            background: var(--neon); color: #000;
            width: 52px; height: 52px; border-radius: 50%;
            font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            z-index: 99;
            font-size: 1.4em;
            box-shadow: 0 0 15px var(--neon);
        }

        #settings-panel label, #settings-panel select {
            display: block; margin: 8px 0;
            color: #e0f7ff;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .logo-main { font-size: 1.9em; }
            .sub-logo { font-size: 1.2em; }
            .site-section { padding: 90px 25px; text-align: center; align-items: center; }
            .site-section h2 a { font-size: 1.7em; }
            .skip-button { padding: 10px 24px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div id="preloader">
        <div class="logo-main">Ferkaveka 1.1</div>
        <div class="sub-logo">Kosmik sayt</div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <button id="skip-btn" class="skip-button">Tezroq o'tkazish</button>
    </div>

    <div id="threejs-container"></div>

    <div id="settings-toggle">⚙️</div>
    <div id="settings-panel">
        <h3 style="margin-bottom: 12px; color: var(--neon); text-align: center;">🌐 Sozlamalar</h3>
        <label for="lang-select">Til / Language / 语言 / 언어 / Язык:</label>
        <select id="lang-select">
            <option value="uz">O'zbek</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="ru">Русский</option>
        </select>
        <label><input type="checkbox" id="music-toggle"> 🎵 Fon musiqasi</label>
        <label><input type="checkbox" id="autorotate-toggle" checked> 🔄 Avtomatik aylanish</label>
    </div>

    <main id="main-content" class="hidden">
        <section class="site-section"><h2><a href="">Ferkaveka ni shaxsiy saytiga xush kelibsiz!</a></h2></section>
        <section class="site-section"><h2><a href="videobulim.html">Qiziqarli videolar </a></h2></section>
        <section class="site-section"><h2><a href="game1.html">Ferkagame </a></h2></section>
        <section class="site-section"><h2><a href="help.html">Ferka ai </a></h2></section>
        <section class="site-section"><h2><a href="haqida.html">Ferka haqida</a></h2></section>
        <section class="site-section"><h2><a href="chat.html">Premum videolar</a></h2></section>
        <section class="site-section"><h2><a href="shops.html">Ferkashops</a></h2></section>
        <section class="site-section"><h2><a href="aloqa.html">Aloqa</a></h2></section>
        <section class="site-section"><h2><a href="https://morgenflix.vercel.app/">musiqa </a></h2></section>
        <section class="site-section"><h2><a href="https://yordamchi-mk.vercel.app/">ASCO</a></h2></section>
        <section class="site-section"><h2><a href="">bo'lim 11</a></h2></section>
        <section class="site-section"><h2><a href="">bo'lim 12</a></h2></section>
        <section class="site-section"><h2><a href="">bo'lim 13</a></h2></section>
        <section class="site-section"><h2><a href="">bo'lim 14</a></h2></section>
        <section class="site-section"><h2><a href="">bo'lim 15</a></h2></section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        // ===== TARJIMALAR — 5 TILDA =====
        const translations = {
            uz: ["Ferkaveka ni shaxsiy saytiga xush kelibsiz!", "Qiziqarli videolar", "Ferkagame", "Ferka haqida", "premum videolar", "Ferkashops", "aloqa", "", "", "", "", "", "", "", "✨"],
            en: ["", "", "", "", "", "", "", "", "", "", "", "", "✨"],
            zh: ["", "", "", "", "", " ", "", "", "", "", "", "", "", "", "✨"],
            ko: ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "✨"],
            ru: ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "✨"]
        };

        // ===== GLOBALS =====
        let scene, camera, renderer, earth, moon, stars, controls;
        let isInit = false, autoRotateEnabled = true;
        const audio = new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_5d3f3e5c91.mp3?filename=ambient-space-143439.mp3');
        audio.loop = true;
        audio.volume = 0.35;

        // ===== SOZLAMALAR — TO'G'RI ISHLASHI =====
        const toggleBtn = document.getElementById('settings-toggle');
        const panel = document.getElementById('settings-panel');

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', (e) => {
            if (!panel.contains(e.target) && e.target !== toggleBtn) {
                panel.style.display = 'none';
            }
        });

        document.getElementById('lang-select').addEventListener('change', (e) => {
            const lang = e.target.value;
            const links = document.querySelectorAll('.site-section h2 a');
            links.forEach((link, i) => {
                link.textContent = translations[lang][i] || link.textContent;
            });
        });

        document.getElementById('music-toggle').addEventListener('change', (e) => {
            if (e.target.checked) {
                audio.play().catch(e => console.log("Audio blocked"));
            } else {
                audio.pause();
            }
        });

        document.getElementById('autorotate-toggle').addEventListener('change', (e) => {
            autoRotateEnabled = e.target.checked;
            if (controls) controls.autoRotate = autoRotateEnabled;
        });

        // ===== PRELOADER =====
        document.getElementById('skip-btn').addEventListener('click', finishPreloader);
        function finishPreloader() {
            document.getElementById('preloader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('preloader').remove();
                initThreeJS();
                initScrollAnimations();
                // Matnni ko'rinadigan qilish
                document.getElementById('main-content').style.opacity = '1';
                document.getElementById('main-content').classList.remove('hidden');
            }, 600);
        }

        // ===== THREE.JS =====
        function initThreeJS() {
            if (isInit) return;
            isInit = true;

            const container = document.getElementById('threejs-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000005);

            camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 0, 600);

            renderer = new THREE.WebGLRenderer({ antialias: window.innerWidth > 768, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // YORUG'LIK — KUCHAYTIRILGAN
            const sunLight = new THREE.PointLight(0xffffff, 3, 2500);
            sunLight.position.set(800, 400, 600);
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0x335577, 0.6));

            // YULDUZLAR — 10 000+
            const starGeo = new THREE.BufferGeometry();
            const starCount = 10000;
            const pos = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);
            for (let i = 0; i < starCount; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 6000;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 4000;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 6000;
                sizes[i] = Math.random() * 2 + 0.5;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const starMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.5,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.9
            });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // YER
            const earthGeo = new THREE.SphereGeometry(60, 40, 40);
            const earthMat = new THREE.MeshPhongMaterial({
                map: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg'),
                bumpMap: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg'),
                bumpScale: 0.03,
                specularMap: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg'),
                specular: new THREE.Color(0x4488aa),
                shininess: 20
            });
            earth = new THREE.Mesh(earthGeo, earthMat);
            scene.add(earth);

            // OY
            const moonGeo = new THREE.SphereGeometry(16, 32, 32);
            const moonMat = new THREE.MeshPhongMaterial({
                map: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/moon_1024.jpg'),
                bumpMap: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/moon_bump_1024.jpg'),
                bumpScale: 0.04
            });
            moon = new THREE.Mesh(moonGeo, moonMat);
            moon.position.set(120, 0, 0);
            scene.add(moon);

            // KAMERA
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 120;
            controls.maxDistance = 1400;
            controls.enablePan = false;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;

            // Animatsiya
            function animate() {
                requestAnimationFrame(animate);
                const t = Date.now() * 0.0005;
                earth.rotation.y += 0.002;
                moon.position.x = Math.cos(t * 0.8) * 120;
                moon.position.z = Math.sin(t * 0.8) * 120;
                moon.rotation.y += 0.003;
                if (!autoRotateEnabled) controls.autoRotate = false;
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ===== KAMERA HAR BIR BO'LIMDA =====
        function initScrollAnimations() {
            const camPositions = [
                [0, 0, 600], [0, 0, 300], [150, 0, 50], [200, 0, 100], [-100, 50, 400],
                [0, 100, 500], [0, 0, 800], [300, 0, 200], [-200, 0, 600], [0, 150, 300],
                [100, 0, 250], [-100, 0, 200], [0, 50, 700], [0, 0, 400], [0, 0, 600]
            ];

            document.querySelectorAll('.site-section').forEach((sec, i) => {
                const lookAt = i === 2 ? [120, 0, 0] : [0, 0, 0];
                ScrollTrigger.create({
                    trigger: sec,
                    start: "top center+=100",
                    onEnter: () => animateCamera(camPositions[i], lookAt),
                    onEnterBack: () => animateCamera(camPositions[i], lookAt)
                });
                gsap.from(sec, { opacity: 0, y: 50, duration: 1, scrollTrigger: { trigger: sec, start: "top 85%" } });
            });
        }

        function animateCamera(pos, target) {
            gsap.to(camera.position, { x: pos[0], y: pos[1], z: pos[2], duration: 2.2, ease: "power2.out" });
            gsap.to(earth.position, { x: -target[0], y: -target[1], z: -target[2], duration: 2.2, ease: "power2.out", onUpdate: () => camera.lookAt(target[0], target[1], target[2]) });
        }

        // ===== YUKLANISH =====
        document.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline({ delay: 0.6 });
            const logo = document.querySelector('.logo-main');
            const sub = document.querySelector('.sub-logo');
            const bar = document.querySelector('.loading-fill');

            tl.from(logo, { y: 50, opacity: 0, duration: 0.9, ease: "back.out(1.8)" })
              .from(sub, { y: 40, opacity: 0, duration: 0.8, ease: "back.out(1.6)" }, "-=0.6")
              .to(bar, { width: "100%", duration: 2.6, ease: "power1.inOut" }, "-=0.4")
              .call(finishPreloader);
        });
    </script>
</body>
</html>
