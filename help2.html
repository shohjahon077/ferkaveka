<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zamonaviy Musiqa Pleyeri</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    .player {
      width: 350px;
      padding: 25px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .cover {
      width: 220px;
      height: 220px;
      border-radius: 20px;
      margin: auto;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: rotate 20s linear infinite;
    }
    @keyframes rotate {
      from {transform: rotate(0);}
      to {transform: rotate(360deg);}
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .artist {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 15px 0;
    }

    button {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 20px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    button:hover {
      background: rgba(255,255,255,0.4);
      transform: scale(1.1);
    }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.3);
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    .volume-control {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="cover"><img id="cover" src="cover1.jpg" alt="cover"></div>
    <div class="title" id="title">Qo‘shiq nomi</div>
    <div class="artist" id="artist">Muallif</div>

    <audio id="audio" src="music1.mp3"></audio>

    <input type="range" id="progress" value="0">

    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶️</button>
      <button id="next">⏭</button>
    </div>

    <div class="volume-control">
      🔉 <input type="range" id="volume" min="0" max="1" step="0.1" value="1"> 🔊
    </div>
  </div>

  <script>
    const songs = [
      {title: "Qo‘shiq 1", artist: "San'atkor 1", src: "music1.mp3", cover: "cover1.jpg"},
      {title: "Qo‘shiq 2", artist: "San'atkor 2", src: "music2.mp3", cover: "cover2.jpg"},
      {title: "Qo‘shiq 3", artist: "San'atkor 3", src: "music3.mp3", cover: "cover3.jpg"}
    ];

    let index = 0;
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const title = document.getElementById("title");
    const artist = document.getElementById("artist");
    const cover = document.getElementById("cover");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");

    function loadSong(i){
      audio.src = songs[i].src;
      title.textContent = songs[i].title;
      artist.textContent = songs[i].artist;
      cover.src = songs[i].cover;
    }
    loadSong(index);

    playBtn.addEventListener("click", () => {
      if(audio.paused){
        audio.play();
        playBtn.textContent = "⏸";
      } else {
        audio.pause();
        playBtn.textContent = "▶️";
      }
    });

    nextBtn.addEventListener("click", () => {
      index = (index + 1) % songs.length;
      loadSong(index);
      audio.play();
      playBtn.textContent = "⏸";
    });

    prevBtn.addEventListener("click", () => {
      index = (index - 1 + songs.length) % songs.length;
      loadSong(index);
      audio.play();
      playBtn.textContent = "⏸";
    });

    audio.addEventListener("timeupdate", () => {
      progress.value = (audio.currentTime / audio.duration) * 100;
    });

    progress.addEventListener("input", () => {
      audio.currentTime = (progress.value / 100) * audio.duration;
    });

    volume.addEventListener("input", () => {
      audio.volume = volume.value;
    });

    audio.addEventListener("ended", () => {
      index = (index + 1) % songs.length;
      loadSong(index);
      audio.play();
    });
  </script>
</body>
</html>
