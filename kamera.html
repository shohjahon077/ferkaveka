<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ferkaveka Camera Pro Max</title>
  <style>
    body {
      background: black;
      color: white;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.6);
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .watermark {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 20px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 0 5px black;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, select {
      background: rgba(255,255,255,0.1);
      border: 2px solid #00ffcc;
      color: white;
      padding: 12px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover, select:hover {
      background: #00ffcc;
      color: black;
      transform: scale(1.1);
    }

    #stopBtn {
      display: none;
      background: red;
      border-color: red;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 5px red; }
      50% { box-shadow: 0 0 20px red; }
      100% { box-shadow: 0 0 5px red; }
    }

    #flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes flashAnim {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="camera-container">
    <video id="camera" autoplay playsinline></video>
    <canvas id="snapshot" style="display:none;"></canvas>
    <div class="watermark">FERKAVEKA</div>
    <div id="flash"></div>
  </div>

  <div class="controls">
    <select id="resolution">
      <option value="256x144">144p</option>
      <option value="426x240">240p</option>
      <option value="640x360">360p</option>
      <option value="854x480">480p</option>
      <option value="1280x720">720p</option>
      <option value="1920x1080">1080p</option>
      <option value="3840x2160">4K</option>
      <option value="7680x4320">8K</option>
    </select>
    <select id="filter">
      <option value="none">Normal</option>
      <option value="grayscale(100%)">Grayscale</option>
      <option value="sepia(100%)">Sepia</option>
      <option value="invert(100%)">Invert</option>
      <option value="blur(3px)">Blur</option>
      <option value="contrast(200%)">Contrast</option>
      <option value="brightness(150%)">Bright</option>
    </select>
    <button onclick="switchCamera()">🔄 Kamera</button>
    <button onclick="takePhoto()">📸 Surat</button>
    <button id="recordBtn" onclick="startRecording()">🔴 Video</button>
    <button id="stopBtn" onclick="stopRecording()">⏹ Stop</button>
  </div>

  <script>
    const video = document.getElementById("camera");
    const snapshot = document.getElementById("snapshot");
    const ctx = snapshot.getContext("2d");
    const resolutionSelect = document.getElementById("resolution");
    const filterSelect = document.getElementById("filter");
    const flash = document.getElementById("flash");

    let mediaRecorder, recordedChunks = [];
    let usingFront = true; // boshlang‘ich: old kamera

    async function startCamera(width=1280, height=720, facingMode="user") {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: width }, height: { ideal: height }, facingMode },
          audio: true
        });
        video.srcObject = stream;
        return stream;
      } catch (err) {
        alert("Kameraga ulanishda xato: " + err);
      }
    }

    function takePhoto() {
      snapshot.width = video.videoWidth;
      snapshot.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.font = "30px Arial";
      ctx.fillText("FERKAVEKA", 20, snapshot.height - 20);

      // Flash animatsiya
      flash.style.animation = "flashAnim 0.3s";
      setTimeout(() => flash.style.animation = "", 300);

      const link = document.createElement("a");
      link.download = "ferkaveka_photo.png";
      link.href = snapshot.toDataURL("image/png");
      link.click();
    }

    async function startRecording() {
      const stream = video.srcObject;
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm; codecs=vp9" });
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = saveVideo;
      mediaRecorder.start();
      document.getElementById("recordBtn").style.display = "none";
      document.getElementById("stopBtn").style.display = "inline-block";
    }

    function stopRecording() {
      mediaRecorder.stop();
      document.getElementById("recordBtn").style.display = "inline-block";
      document.getElementById("stopBtn").style.display = "none";
    }

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: "video/webm" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ferkaveka_video.webm";
      a.click();
      URL.revokeObjectURL(url);
    }

    resolutionSelect.addEventListener("change", () => {
      const [w,h] = resolutionSelect.value.split("x").map(Number);
      startCamera(w,h, usingFront ? "user" : "environment");
    });

    filterSelect.addEventListener("change", () => {
      video.style.filter = filterSelect.value;
    });

    function switchCamera() {
      usingFront = !usingFront;
      const [w,h] = resolutionSelect.value.split("x").map(Number);
      startCamera(w,h, usingFront ? "user" : "environment");
    }

    startCamera();
  </script>
</body>
</html>
