<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferkalauncher</title>
<style>
/* ===== Body va container ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #1e1e2f, #2c2c3c);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding-top: 20px;
}

.container {
  text-align: center;
  width: 95%;
  max-width: 500px;
  background: rgba(44,44,60,0.9);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* ===== Sarlavha ===== */
h1 {
  font-size: 2em;
  margin-bottom: 20px;
  color: #ff6a00;
  text-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

/* ===== Tugmalar ===== */
.btn {
  display: inline-block;
  padding: 12px 25px;
  background: linear-gradient(45deg, #ff6a00, #ff4500);
  color: #fff;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 20px;
  transition: all 0.3s ease;
  font-weight: bold;
  font-size: 1em;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

/* ===== File ro'yxati ===== */
.file-list {
  text-align: left;
  max-height: 400px;
  overflow-y: auto;
  margin-bottom: 10px;
}

.file-item {
  background: #3a3a4a;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
}

.file-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.file-item button {
  padding: 6px 12px;
  background: #ff4500;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: #fff;
  font-weight: bold;
  transition: background 0.3s ease;
}

.file-item button:hover {
  background: #ff6a00;
}

video, audio, img {
  margin-top: 10px;
  width: 100%;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.3);
}

/* ===== Mobile responsive ===== */
@media (max-width: 500px) {
  h1 {
    font-size: 1.6em;
  }
  .btn {
    width: 90%;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1>Ferkalauncher</h1>
  <div class="file-selector">
    <label for="fileInput" class="btn">Fayllarni tanlash</label>
    <input type="file" id="fileInput" multiple style="display:none">
  </div>
  <div id="fileList" class="file-list"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');

fileInput.addEventListener('change', () => {
  fileList.innerHTML = '';

  const files = Array.from(fileInput.files);
  files.forEach((file) => {
    const fileItem = document.createElement('div');
    fileItem.className = 'file-item';
    
    const fileHeader = document.createElement('div');
    fileHeader.className = 'file-header';

    const fileName = document.createElement('span');
    fileName.textContent = file.name;

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'O‘chirish';
    deleteBtn.addEventListener('click', () => {
      if(confirm(`Siz ${file.name} faylini o‘chirmoqchimisiz?`)) {
        fileItem.remove();
        alert(`${file.name} o‘chirildi (brauzer memoryda).`);
      }
    });

    fileHeader.appendChild(fileName);
    fileHeader.appendChild(deleteBtn);
    fileItem.appendChild(fileHeader);

    // Media ko'rsatish
    if(file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = file.name;
      fileItem.appendChild(img);
    }

    if(file.type.startsWith('video/')) {
      const video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.controls = true;
      fileItem.appendChild(video);
    }

    if(file.type.startsWith('audio/')) {
      const audio = document.createElement('audio');
      audio.src = URL.createObjectURL(file);
      audio.controls = true;
      fileItem.appendChild(audio);
    }

    fileList.appendChild(fileItem);
  });
});
</script>
</body>
</html>
