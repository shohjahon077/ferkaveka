<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Aloqa Bo'limi (Kosmik)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
        }
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease-out;
        }
        #loading-text {
            font-size: 2.5em;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div id="loading-text">🌌 Aloqa Yuklanmoqda...</div>
    </div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.03;
        controls.maxDistance = 25;
        controls.minDistance = 3;
        camera.position.set(0, 0, 10);

        // Ambient + directional lights
        scene.add(new THREE.AmbientLight(0x222233, 0.4));
        const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // Floating particles (slow-moving stars)
        const particles = (() => {
            const geometry = new THREE.BufferGeometry();
            const count = 2000;
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) {
                pos[i] = (Math.random() - 0.5) * 2000;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.2,
                transparent: true,
                opacity: 0.8
            });
            return new THREE.Points(geometry, material);
        })();
        scene.add(particles);

        // Create contact panel
        function createContactTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Semi-transparent dark background
            ctx.fillStyle = 'rgba(0, 0, 10, 0.6)';
            ctx.fillRect(0, 0, 1024, 512);

            // Title
            ctx.font = 'bold 100px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 20;
            ctx.fillText('ALOQA', 512, 120);

            // Reset shadow for details
            ctx.shadowBlur = 0;

            // Contacts
            ctx.font = 'bold 60px "Segoe UI", sans-serif';
            ctx.fillStyle = '#ff00ff';
            ctx.fillText('📸 @ferkaveka', 512, 230);

            ctx.fillStyle = '#00ffff';
            ctx.fillText('💬 @FerkaVeka', 512, 330);

            ctx.fillStyle = '#00ff00';
            ctx.fillText('📞 +998 91 703 13 34', 512, 430);

            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            return texture;
        }

        const contactTexture = createContactTexture();
        const contactMaterial = new THREE.MeshBasicMaterial({
            map: contactTexture,
            transparent: true,
            opacity: 0.92,
            side: THREE.DoubleSide
        });

        const panel = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 5),
            contactMaterial
        );
        panel.position.z = 0;
        scene.add(panel);

        // Add glowing edges (optional: wireframe for hologram feel)
        const edgeGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(10.2, 5.2), 10);
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
        const edges = new THREE.LineSegments(edgeGeo, edgeMat);
        scene.add(edges);

        // Animation loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Slow floating effect
            panel.position.y = Math.sin(time * 0.3) * 0.2;
            panel.rotation.y = Math.sin(time * 0.2) * 0.05;

            // Rotate particles slowly
            particles.rotation.y += 0.0002;

            // Sync edge geometry
            edges.position.copy(panel.position);
            edges.rotation.copy(panel.rotation);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Hide loading
        setTimeout(() => {
            const loader = document.getElementById('loading');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 800);
        }, 1200);

        // Responsive
        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
